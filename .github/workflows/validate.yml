name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check data syntax
        run: |
          node --check data.js
          node --check clinical-schema.js
          node --check scripts/clinical-schema.js

      - name: Check application syntax
        run: |
          node --check app.js
          node --check media-data.js
          node --check scripts/media.js
          node --check quiz-data.js
          node --check quiz-app.js
          node --check scripts/quiz.js
          node --check review-data.js
          node --check review-status.js
          node --check oss-feedback.js
          node --check review-ui.js
          node --check scripts/review-governance.js
          node --check scripts/review-batch.js

      - name: Check follow-up module syntax
        run: |
          node --check followup-data.js
          node --check followup-app.js
          node --check scripts/clinical-review.js
          node --check scripts/follow-up.js

      - name: Validate clinical governance and follow-up data
        run: |
          node scripts/clinical-review.js --validate
          node scripts/clinical-schema.js
          node scripts/follow-up.js
          node scripts/media.js
          node scripts/quiz.js
          node scripts/review-governance.js

      - name: Verify generated public review artifacts
        shell: bash
        run: |
          node scripts/review-governance.js --write
          node scripts/review-batch.js --write
          git diff --exit-code -- review-status.json review-status.js GOAL9_HUMAN_REVIEW_GATE.md goal9-review-decisions.template.json

      - name: Run dependency-free tests
        run: node --test tests/*.test.js

      - name: Check whitespace errors
        shell: bash
        run: |
          git diff --check
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi
