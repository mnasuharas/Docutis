name: Bug report
description: Report a reproducible technical problem in Docutis.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include patient data, credentials or other sensitive information."
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Which page, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Do not include patient information or credentials.
  - type: dropdown
    id: clinical
    attributes:
      label: Could this be a clinical content problem rather than a software bug?
      options:
        - "No"
        - "Yes — I will also use the clinical correction or evidence template"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or condition URL
  - type: input
    id: browser
    attributes:
      label: Browser and device
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact
      description: Include keyboard or assistive-technology details when relevant.
