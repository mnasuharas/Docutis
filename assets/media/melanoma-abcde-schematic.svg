<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Schematic melanoma ABCDE warning-feature concept</title>
  <desc id="desc">Five labelled panels illustrate asymmetry, border irregularity, color variation, diameter context and evolution. This is not a diagnostic image.</desc>
  <rect width="800" height="500" fill="#f6faf8"/><text x="40" y="52" font-family="system-ui" font-size="28" font-weight="700" fill="#18352d">ABCDE warning features · schematic</text>
  <g font-family="system-ui" fill="#18352d" text-anchor="middle"><g transform="translate(90 150)"><path d="M0 55C-55 24-42-45 5-42C48-64 70-8 45 35C32 62 18 76 0 55Z" fill="#7b4f36" stroke="#18352d" stroke-width="5"/><line x1="0" y1="-65" x2="0" y2="80" stroke="#18352d" stroke-dasharray="7 7"/><text y="120" font-size="22" font-weight="700">A · asymmetry</text></g>
  <g transform="translate(245 150)"><path d="M0 58L-24 42L-58 46L-45 10L-61-19L-26-28L-8-58L17-34L52-40L45-5L62 22L31 39Z" fill="#9b6544" stroke="#18352d" stroke-width="5"/><text y="120" font-size="22" font-weight="700">B · border</text></g>
  <g transform="translate(400 150)"><circle r="62" fill="#c89262" stroke="#18352d" stroke-width="5"/><path d="M-48-10Q-10-58 20-30T50 18Q16 58-24 40Z" fill="#4d3027"/><circle cx="18" cy="18" r="16" fill="#efe0b9" stroke="#18352d" stroke-width="3"/><text y="120" font-size="22" font-weight="700">C · color</text></g>
  <g transform="translate(555 150)"><circle r="58" fill="#8c5a3c" stroke="#18352d" stroke-width="5"/><line x1="-70" y1="78" x2="70" y2="78" stroke="#18352d" stroke-width="4"/><path d="M-70 70v16M70 70v16" stroke="#18352d" stroke-width="4"/><text y="120" font-size="22" font-weight="700">D · diameter*</text></g>
  <g transform="translate(700 150)"><circle cx="-28" r="30" fill="#c89262" stroke="#18352d" stroke-width="4"/><path d="M23 45C-12 22-4-41 34-44C70-28 72 29 23 45Z" fill="#6f4734" stroke="#18352d" stroke-width="5"/><path d="M-4 0h20" stroke="#18352d" stroke-width="4" marker-end="url(#arrow)"/><text y="120" font-size="22" font-weight="700">E · evolution</text></g></g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#18352d"/></marker></defs>
  <rect x="40" y="330" width="720" height="120" rx="16" fill="#e4f1ec" stroke="#2b6f5d" stroke-width="2"/><text x="65" y="368" font-family="system-ui" font-size="21" font-weight="700" fill="#18352d">Look for change and the overall pattern—not one feature alone.</text><text x="65" y="402" font-family="system-ui" font-size="18" fill="#29443c">*Diameter is context, not a rule. Small or amelanotic melanoma can occur.</text><text x="65" y="432" font-family="system-ui" font-size="18" fill="#29443c">Educational schematic · clinician review required · not a diagnostic substitute</text>
</svg>
