  <g fill="none" stroke="#9e2f36" stroke-width="6" stroke-linecap="round"><path d="M155 190Q210 195 245 226M190 197l-14-30M208 204l12-34M445 194Q392 200 358 226M412 203l17-35M395 209l-8-34"/><path d="M185 300Q235 290 258 267M415 298Q368 289 343 266"/></g>
