  <title id="title">Schematic basal cell carcinoma morphology and dermoscopic clues</title>
  <desc id="desc">A labelled schematic shows a pearly raised border, central ulceration, arborising vessels and blue-grey ovoid structures.</desc>
  <rect width="800" height="500" fill="#f6faf8"/><text x="40" y="52" font-family="system-ui" font-size="28" font-weight="700" fill="#18352d">Basal cell carcinoma clues · schematic</text>
