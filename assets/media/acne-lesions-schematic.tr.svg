<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Şematik akne lezyon tipleri ve şiddet ilerlemesi</title>
  <desc id="desc">Dört etiketli kesit kapalı komedon, açık komedon, inflamatuar papül veya püstül ve daha derin nodülü gösterir. Ok artan derinliği işaret eder.</desc>
  <rect width="800" height="500" fill="#f6faf8"/><text x="40" y="52" font-family="system-ui" font-size="28" font-weight="700" fill="#18352d">Akne lezyon tipleri · şema</text>
  <defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2cdb9"/><stop offset="1" stop-color="#e9b69f"/></linearGradient><marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#18352d"/></marker></defs>
  <g font-family="system-ui" text-anchor="middle" fill="#18352d"><g transform="translate(40 105)"><rect width="160" height="250" rx="18" fill="url(#skin)" stroke="#18352d" stroke-width="4"/><path d="M70 20Q80 80 75 170" fill="none" stroke="#18352d" stroke-width="9"/><ellipse cx="76" cy="40" rx="23" ry="14" fill="#f5e8cf" stroke="#18352d" stroke-width="3"/><text x="80" y="290" font-size="20" font-weight="700">Kapalı komedon</text></g>
  <g transform="translate(225 105)"><rect width="160" height="250" rx="18" fill="url(#skin)" stroke="#18352d" stroke-width="4"/><path d="M75 15Q80 80 75 170" fill="none" stroke="#18352d" stroke-width="12"/><circle cx="76" cy="27" r="15" fill="#40342f" stroke="#18352d" stroke-width="3"/><text x="80" y="290" font-size="20" font-weight="700">Açık komedon</text></g>
  <g transform="translate(410 105)"><rect width="160" height="250" rx="18" fill="url(#skin)" stroke="#18352d" stroke-width="4"/><circle cx="80" cy="58" r="48" fill="#d76767" stroke="#18352d" stroke-width="4"/><circle cx="80" cy="45" r="18" fill="#fff4d4" stroke="#18352d" stroke-width="3"/><path d="M80 70v105" stroke="#18352d" stroke-width="8"/><text x="80" y="290" font-size="20" font-weight="700">Papül / püstül</text></g>
  <g transform="translate(595 105)"><rect width="160" height="250" rx="18" fill="url(#skin)" stroke="#18352d" stroke-width="4"/><path d="M80 35v145" stroke="#18352d" stroke-width="8"/><ellipse cx="80" cy="170" rx="58" ry="48" fill="#b74c55" stroke="#18352d" stroke-width="4"/><text x="80" y="290" font-size="20" font-weight="700">Daha derin nodül</text></g></g>
  <path d="M90 430H710" stroke="#18352d" stroke-width="4" marker-end="url(#arrow2)"/><text x="400" y="418" font-family="system-ui" font-size="18" text-anchor="middle" fill="#18352d">Artan inflamatuar derinlik ve skar kaygısı</text><text x="40" y="478" font-family="system-ui" font-size="18" fill="#29443c">Eğitim şeması · hekim incelemesi gerekli · tanının yerine geçmez</text>
</svg>
